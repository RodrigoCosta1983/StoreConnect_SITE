<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Conta - Store & Connect</title>
  
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body { background-color: #f0f2f5; font-family: 'Poppins', sans-serif; }
    .card-painel {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: none;
      padding: 30px;
      margin-top: 50px;
    }
    .status-badge {
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 15px;
    }
    .status-active { background-color: #d1fae5; color: #065f46; } /* Verde */
    .status-inactive { background-color: #fee2e2; color: #991b1b; } /* Vermelho */
    .loader { display: none; text-align: center; padding: 50px; }
    #conteudo-painel { display: none; } /* Escondido até carregar */
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <img src="assets/img/icon2.png" width="30" height="30" class="d-inline-block align-top me-2" alt="">
        Store & Connect
      </a>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div id="loader" class="loader" style="display: block;">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">Carregando suas informações...</p>
        </div>

        <div id="conteudo-painel" class="card-painel">
          
          <div class="text-center mb-4">
            <img id="userPhoto" src="https://via.placeholder.com/80" class="rounded-circle mb-3" style="width: 80px; height: 80px; object-fit: cover;">
            <h4 id="userName" class="fw-bold">Usuário</h4>
            <p id="userEmail" class="text-muted small">carregando...</p>
          </div>

          <hr>

          <div class="text-center">
            <h5 class="mb-3">Status da Assinatura</h5>
            
            <div id="statusBadge" class="status-badge status-inactive">
              Verificando...
            </div>

            <p id="statusMessage" class="text-muted mb-4">
              Identificamos que você ainda não possui um plano ativo.
            </p>

            <div id="actionsBlock">
  
            <button id="btnStripe" class="btn btn-primary w-100 py-2 mb-2 fw-bold">
                <i class="bi bi-credit-card me-2"></i> 
                <span id="btnStripeText">Assinar Agora</span>
            </button>
            
            <button id="btnPortal" class="btn btn-outline-secondary w-100 py-2 mb-2 fw-bold" style="display: none;">
                <i class="bi bi-file-text me-2"></i> 
                Minhas Faturas & Dados
            </button>

            <p class="small text-muted mt-2">
                Gerenciado de forma segura pelo Stripe.
            </p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // 1. Importações
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

    // 2. Configuração
    const firebaseConfig = {
      apiKey: "AIzaSyAXvWxIcts2Nd8QW-prkD3rJHKxqMIyzUg",
      authDomain: "store-connect-app.firebaseapp.com",
      projectId: "store-connect-app",
      storageBucket: "store-connect-app.firebasestorage.app",
      messagingSenderId: "294766590074",
      appId: "1:294766590074:web:fbe25231b8ef11d8afe3c3",
      measurementId: "G-KYVFYLZHSQ"
    };

    const app = initializeApp(firebaseConfig);
    const functions = getFunctions(app, 'us-central1');
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elementos da UI
    const loader = document.getElementById('loader');
    const painel = document.getElementById('conteudo-painel');
    const statusBadge = document.getElementById('statusBadge');
    const statusMessage = document.getElementById('statusMessage');

    // 3. Monitorar Auth
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      // Preenche dados básicos visualmente
      document.getElementById('userName').innerText = user.displayName || "Lojista";
      document.getElementById('userEmail').innerText = user.email;
      if(user.photoURL) document.getElementById('userPhoto').src = user.photoURL;

      // 4. Buscar dados da loja
      await verificarAssinatura(user);
    });

    // Função Principal
    async function verificarAssinatura(user) {
      try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        let status = "inactive"; 

        if (userSnap.exists()) {
          const userData = userSnap.data();
          const myStoreId = userData.storeId; 

          if (myStoreId) {
            console.log("Loja encontrada:", myStoreId);
            const storeRef = doc(db, "stores", myStoreId);
            const storeSnap = await getDoc(storeRef);

            if (storeSnap.exists()) {
              status = storeSnap.data().subscriptionStatus || "inactive";
            }
          } else {
            console.log("Usuário sem storeId vinculado.");
          }
        } else {
          // Cria registro básico se não existir
          await setDoc(userRef, {
            email: user.email,
            dono: user.displayName,
            createdAt: new Date()
          }, { merge: true });
        }

        // Chama a função visual corrigida
        await atualizarTela(status, user);

      } catch (error) {
        console.error("Erro ao buscar dados:", error);
        statusBadge.innerText = "Erro ao carregar";
        statusBadge.className = "status-badge status-inactive";
      }
    }

    // --- LÓGICA HÍBRIDA (2 BOTÕES) CORRIGIDA ---
    async function atualizarTela(status, user) {
      loader.style.display = 'none';
      painel.style.display = 'block';

      const btnMain = document.getElementById('btnStripe');
      const btnMainText = document.getElementById('btnStripeText');
      const btnPortal = document.getElementById('btnPortal');
      
      const badge = document.getElementById('statusBadge');
      const msg = document.getElementById('statusMessage');

      // ---------------------------------------------------------
      // 1. LÓGICA DO BOTÃO SECUNDÁRIO (PORTAL / FATURAS)
      // Verifica se o usuário tem histórico (stripeCustomerId)
      // ---------------------------------------------------------
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      
      if (userSnap.exists() && userSnap.data().stripeCustomerId) {
          // Se tem histórico, MOSTRA o botão de faturas
          btnPortal.style.display = "block";
          
          btnPortal.onclick = async () => {
              const originalText = btnPortal.innerHTML;
              btnPortal.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Carregando...';
              
              try {
                  const createPortalSession = httpsCallable(functions, 'createPortalSession');
                  const result = await createPortalSession();
                  window.location.href = result.data.url;
              } catch (erro) {
                  console.error(erro);
                  alert("Erro ao abrir portal.");
                  btnPortal.innerHTML = originalText;
              }
          };
      } else {
          // Se não tem histórico (nunca comprou), esconde
          btnPortal.style.display = "none";
      }

      // ---------------------------------------------------------
      // 2. LÓGICA DO BOTÃO PRINCIPAL (STATUS / CHECKOUT)
      // ---------------------------------------------------------
      if (status === 'active') {
        // --- CENÁRIO: TUDO OK ---
        badge.className = "status-badge status-active";
        badge.innerText = "ASSINATURA ATIVA";
        msg.innerText = "Sua loja está online e funcionando.";
        
        // Botão Principal vira apenas um "Crachá" informativo
        btnMain.className = "btn btn-success w-100 py-2 mb-2 fw-bold disabled";
        btnMainText.innerText = "Plano Ativo ✔";
        btnMain.style.opacity = "1"; 
        btnMain.onclick = null; // Não faz nada, pois o gerenciamento é no botão secundário

      } else {
        // --- CENÁRIO: PENDENTE / CANCELADO ---
        badge.className = "status-badge status-inactive";
        badge.innerText = "ASSINATURA INATIVA";
        msg.innerText = "Regularize seu pagamento para liberar o acesso.";
        
        // Botão Principal vira CHECKOUT (Venda)
        btnMain.className = "btn btn-primary w-100 py-2 mb-2 fw-bold";
        btnMainText.innerText = "Assinar Agora (R$ 10,00)";
        
        btnMain.onclick = () => { 
            const linkStripe = "https://buy.stripe.com/test_dRm14nfjw6vRapJ4U82go00"; 
            window.location.href = `${linkStripe}?client_reference_id=${user.uid}&prefilled_email=${user.email}`; 
        };
      }
    }

    // Botão Sair
    document.getElementById('btnLogout').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });

  </script>
</body>
</html>
