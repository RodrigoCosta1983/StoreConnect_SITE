<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Assinante - Store & Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/icon2.png?v=2">
    <style>
        /* --- ESTILO DO PAINEL --- */
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .navbar { background-color: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.05); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #0b1220; }
        .brand img { height: 32px; }
        .btn-logout { border: 1px solid #ff4d4d; color: #ff4d4d; background: transparent; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-logout:hover { background: #ff4d4d; color: white; }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card-profile { background: white; width: 100%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px 30px; text-align: center; }
        
        .avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid #f0f2f5; }
        .user-name { font-size: 20px; font-weight: 700; color: #333; margin: 0; }
        .user-email { color: #888; font-size: 14px; margin-top: 5px; margin-bottom: 25px; }

        .status-box { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .status-title { font-size: 14px; color: #666; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .badge-status { display: inline-block; padding: 8px 16px; border-radius: 50px; font-weight: 600; font-size: 13px; }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-inactive { background: #fee2e2; color: #991b1b; }

        /* Botões de Ação */
        .btn-action { width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s; margin-top: 10px; }
        .btn-action:active { transform: scale(0.98); }
        
        /* Botão Pagar (Azul/Roxo) */
        .btn-checkout { background: #0d6efd; color: white; box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3); }
        .btn-checkout:hover { background: #0b5ed7; }

        /* Botão Portal (Cinza Escuro) */
        .btn-portal { background: #343a40; color: white; }
        .btn-portal:hover { background: #23272b; }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: grid; place-items: center; z-index: 999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        
        .footer-note { font-size: 12px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading-overlay">
        <div style="text-align:center">
            <div class="spinner"></div>
            <p style="margin-top:15px; color:#555; font-size:14px;">Carregando seus dados...</p>
        </div>
    </div>

    <nav class="navbar">
        <div class="brand">
            <img src="assets/img/icon2.png" alt="Logo">
            Store & Connect
        </div>
        <button id="btnLogout" class="btn-logout">Sair</button>
    </nav>

    <div class="container">
        <div class="card-profile">
            <img id="userPhoto" src="https://ui-avatars.com/api/?name=User&background=random" class="avatar" alt="Foto">
            <h2 id="userName" class="user-name">Carregando...</h2>
            <p id="userEmail" class="user-email">...</p>

            <div class="status-box">
                <div class="status-title">Status da Assinatura</div>
                <div id="statusBadge" class="badge-status status-inactive">VERIFICANDO...</div>
                <p id="statusText" style="font-size:13px; color:#666; margin-top:10px;">
                    Aguarde, estamos buscando suas informações.
                </p>
            </div>

            <div id="actionsArea">
                </div>

            <p class="footer-note">Gerenciado de forma segura pelo Stripe.</p>
        </div>
    </div>

    <div id="successMessage" class="hidden" style="position:fixed; top:20px; right:20px; background:#d1fae5; color:#065f46; padding:15px 20px; border-radius:10px; box-shadow:0 5px 20px rgba(0,0,0,0.1); animation:slideIn 0.5s;">
        🎉 <strong>Pagamento confirmado!</strong> Sua assinatura está ativa.
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

        // CONFIGURAÇÃO (A MESMA DO INDEX)
        const firebaseConfig = {
            apiKey: "AIzaSyAXvWxIcts2Nd8QW-prkD3rJHKxqMIyzUg",
            authDomain: "store-connect-app.firebaseapp.com",
            projectId: "store-connect-app",
            storageBucket: "store-connect-app.firebasestorage.app",
            messagingSenderId: "294766590074",
            appId: "1:294766590074:web:fbe25231b8ef11d8afe3c3",
            measurementId: "G-KYVFYLZHSQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app, "us-central1");

        // Elementos da Tela
        const loadingScreen = document.getElementById('loadingScreen');
        const userNameEl = document.getElementById('userName');
        const userEmailEl = document.getElementById('userEmail');
        const userPhotoEl = document.getElementById('userPhoto');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const actionsArea = document.getElementById('actionsArea');
        const btnLogout = document.getElementById('btnLogout');

        // VERIFICA LOGIN
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html"; // Chuta pra fora se não logar
                return;
            }

            // Preenche dados básicos
            userNameEl.innerText = user.displayName || "Lojista";
            userEmailEl.innerText = user.email;
            if(user.photoURL) userPhotoEl.src = user.photoURL;

            // Escuta o Banco de Dados em Tempo Real (Se pagar, atualiza na hora!)
            monitorUserSubscription(user.uid);
        });

        function monitorUserSubscription(uid) {
            const userRef = doc(db, "users", uid);

            onSnapshot(userRef, (docSnap) => {
                loadingScreen.classList.add('hidden'); // Esconde loading
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const status = data.subscriptionStatus || "inactive";
                    const stripeId = data.stripeCustomerId;

                    updateUI(status, stripeId);
                } else {
                    // Usuário novo sem doc no banco (Cria visual padrão)
                    updateUI("inactive", null);
                }
            }, (error) => {
                console.error("Erro ao ler dados:", error);
                statusText.innerText = "Erro de conexão.";
            });
        }

        function updateUI(status, stripeId) {
            actionsArea.innerHTML = ""; // Limpa botões antigos

            if (status === "active") {
                // --- CENÁRIO 1: ASSINANTE ATIVO ---
                statusBadge.className = "badge-status status-active";
                statusBadge.innerText = "ASSINATURA ATIVA";
                statusText.innerText = "Sua loja está online e funcionando.";

                // Botão Gerenciar (Portal)
                const btn = document.createElement('button');
                btn.className = "btn-action btn-portal";
                btn.innerHTML = `<i class="bi bi-credit-card-2-front"></i> Gerenciar Assinatura`;
                btn.onclick = () => openPortal();
                actionsArea.appendChild(btn);

            } else {
                // --- CENÁRIO 2: NÃO ASSINANTE / INATIVO ---
                statusBadge.className = "badge-status status-inactive";
                statusBadge.innerText = "ASSINATURA INATIVA";
                statusText.innerText = "Regularize seu pagamento para liberar o acesso.";

                // Botão Pagar (Checkout)
                const btn = document.createElement('button');
                btn.className = "btn-action btn-checkout";
                btn.innerHTML = `<i class="bi bi-cart-check"></i> Assinar Agora (R$ 25,00)`;
                btn.onclick = () => startCheckout();
                actionsArea.appendChild(btn);
            }
        }

        // --- FUNÇÕES DE CHAMADA AO BACKEND ---

        async function startCheckout() {
            const btn = document.querySelector('.btn-checkout');
            if(btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> Criando pagamento...'; }

            try {
                // Chama a nova função que criamos no backend
                const createCheckout = httpsCallable(functions, 'createCheckoutSession');
                const result = await createCheckout();
                
                // Redireciona para o Stripe
                window.location.href = result.data.url;
            } catch (error) {
                console.error(error);
                alert("Erro ao iniciar pagamento: " + error.message);
                if(btn) { btn.disabled = false; btn.innerText = "Tentar Novamente"; }
            }
        }

        async function openPortal() {
            const btn = document.querySelector('.btn-portal');
            if(btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> Carregando...'; }

            try {
                const createPortal = httpsCallable(functions, 'createPortalSession');
                const result = await createPortal();
                window.location.href = result.data.url;
            } catch (error) {
                console.error(error);
                alert("Erro ao abrir portal: " + error.message);
                if(btn) { btn.disabled = false; btn.innerText = "Tentar Novamente"; }
            }
        }

        // Logout
        btnLogout.addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });

        // Checar se voltou do sucesso (?sucesso=true)
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('sucesso') === 'true') {
            document.getElementById('successMessage').classList.remove('hidden');
            // Limpa a URL
            window.history.replaceState({}, document.title, "painel.html");
            setTimeout(() => document.getElementById('successMessage').classList.add('hidden'), 5000);
        }

    </script>
</body>
</html>
